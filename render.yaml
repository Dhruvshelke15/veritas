services:
  - type: web
    name: veritas-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      # Free HuggingFace account -> huggingface.co/settings/tokens (read
      # scope is enough). Used for hosted query/document embeddings instead
      # of loading PyTorch locally — see app/ingestion/indexer.py.
      - key: HUGGINGFACE_API_KEY
        sync: false
      # Set manually per-deployment (your Vercel URL) — sync: false means
      # blueprint syncs won't overwrite whatever you set in the dashboard.
      # Without this, every push resets it to the placeholder below and
      # silently breaks CORS against your real frontend.
      - key: VERITAS_ALLOWED_ORIGINS
        sync: false
        value: http://localhost:5173
      # TensorFlow alone is still heavy enough to be worth skipping on the
      # free instance type, even now that embeddings are hosted rather than
      # local. Routing already fails open without a classifier (see
      # app/rag/routing.py). Set to "true" if you upgrade to a bigger
      # instance and want the out-of-scope pre-filter + advice disclaimer.
      - key: VERITAS_CLASSIFIER_ENABLED
        value: "false"
