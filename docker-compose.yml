services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - hf-cache:/root/.cache
    environment:
      - VERITAS_UPLOAD_DIR=/data/uploads
      - VERITAS_CHROMA_DIR=/data/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  hf-cache:
